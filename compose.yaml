services:
  opencode2api:
    image: ${OPENCODE2API_IMAGE:-ghcr.io/wwss11/opencode2api:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config/config.json
      LISTEN_ADDRESS: 0.0.0.0:8080
      WEBUI_LISTEN_ADDRESS: 0.0.0.0:8081
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
      - "${OPENCODE2API_WEBUI_PORT:-8081}:8081"
    volumes:
      - .:/app/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
